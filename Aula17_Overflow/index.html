<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .exemplo{
            background: rgb(136, 136, 168);
            color: rgb(0, 0, 0);
            height: 150px;
            overflow: auto;

            /*Hidden mostra somente conteudo que cabe dentro da caixa
            
            scroll quando conteudo e mais que a caixa coloca um scroll
            
            auto faz automaticamente parecido com scroll mas ele faz so se for preciso*/

        }

        body{
            overflow-y: hidden;
            /*overflow-x: hidden; - faz tirar a barra de rolagem no eixo x*/
            /*Faz a barra de rolagem sumir*/
        }
    </style>
</head>
<body>
    <h1>Meu primeiro CSS</h1>

    <div class="exemplo">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tenetur iste, quisquam inventore quidem deserunt animi placeat, minus ipsum accusantium quam iure odio vero quasi non sit molestiae architecto, veritatis dolores?</p>
    </div>
</body>
</html>
